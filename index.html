<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Pembe Parçacık Kalbi</title>
  <style>
    html, body { width:100%; height:100%; margin:0; background:#000; overflow:hidden; }
    canvas { position:fixed; inset:0; display:block; width:100%; height:100%; touch-action:none; cursor:pointer; }
    .hint {
      position:fixed; left:0; right:0; bottom:max(22px, env(safe-area-inset-bottom));
      margin:0; text-align:center; pointer-events:none;
      font:500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing:.14em; text-transform:uppercase; color:rgba(255,196,230,.62);
      opacity:0; transition:opacity 1.6s ease;
    }
    .hint.show { opacity:1; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <canvas id="art" role="img" aria-label="Siyah zeminde pembe parçacıklardan oluşan, atan bir kalp animasyonu"></canvas>
  <p class="hint" id="hint" aria-hidden="true">Dokun · dağıt &nbsp;&nbsp;/&nbsp;&nbsp; çift dokun · baştan</p>
  <p class="sr-only">Pembe parçacıklar dışarıdan süzülerek bir kalp oluşturur ve kalp atmaya başlar. Dokunmak kalbi dağıtıp yeniden toplar, çift dokunmak animasyonu baştan başlatır.</p>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('art');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hint = document.getElementById('hint');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Same heart and particle counts as the original; positions live in "heart units"
    // (the original 700-unit canvas) so a resize never has to rebuild the animation.
    const FILL = 1000, DETAIL = 3500;
    const Y_SHIFT = 38;          // the heart curve spans y -263..186; this centers it
    const BEAT_PERIOD = 1.15;    // seconds per heartbeat
    const COLORS = 18, WIDTHS = [0.55, 0.95, 1.4];
    const DUST = 110;

    const rand = (min, max) => min + Math.random() * (max - min);
    const easeOutCubic = v => 1 - (1 - v) ** 3;

    function heart(angle, scale) {
      return [
        16 * Math.sin(angle) ** 3 * scale,
        (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale
      ];
    }

    // Picking angles uniformly piles points up where the curve moves slowly (the top dip and
    // the bottom tip), which draws a bright seam down the middle. Sample by arc length instead.
    function curveSpeed(a) {
      const dx = 48 * Math.sin(a) ** 2 * Math.cos(a);
      const dy = -13 * Math.sin(a) + 10 * Math.sin(2 * a) + 6 * Math.sin(3 * a) + 4 * Math.sin(4 * a);
      return Math.hypot(dx, dy);
    }
    let maxSpeed = 0;
    for (let i = 0; i < 2000; i++) maxSpeed = Math.max(maxSpeed, curveSpeed(i / 2000 * Math.PI * 2));
    function sampleAngle() {
      for (;;) {
        const a = rand(0, Math.PI * 2);
        if (Math.random() * maxSpeed < curveSpeed(a)) return a;
      }
    }

    // Pinks from deep magenta to pale rose, within the original colour ranges.
    const palette = Array.from({ length: COLORS }, (_, i) => {
      const k = i / (COLORS - 1);
      const r = Math.round((0.80 + 0.20 * k) * 255);
      const g = Math.round((0.10 + 0.36 * k + rand(-0.03, 0.03)) * 255);
      const b = Math.round((0.48 + 0.42 * k + rand(-0.04, 0.04)) * 255);
      return `rgb(${r},${g},${b})`;
    });

    let particles = [], formedAt = 0, dust = [], glints = [];
    let time = 0, last = performance.now();
    let width = 1, height = 1, dpr = 1, unit = 1, cx = 0, cy = 0;
    let layer, layerCtx, glow, glowCtx, background;
    const pointer = { x: 0, y: 0, active: false };
    let lastTap = -1, hintShown = false, interacted = false;

    function build() {
      particles = [];
      for (let i = 0; i < FILL + DETAIL; i++) {
        const detail = i >= FILL;
        const angle = sampleAngle();
        // Detail strokes lean toward the rim so the outline glows, as in the original's second pass.
        const scale = detail ? 0.5 + 15 * Math.random() ** 0.45 : rand(0.5, 15.5);
        const [hx, hy] = heart(angle, scale);
        const dir = Math.atan2(hy, hx);
        const len = detail ? rand(2, 12) : rand(4, 14);
        const startAngle = rand(0, Math.PI * 2), startRadius = rand(430, 780);
        const t0 = detail ? rand(2.4, 7.4) : rand(0, 3.2);
        const dur = detail ? rand(0.9, 1.5) : rand(1.1, 1.8);
        particles.push({
          hx, hy: hy + Y_SHIFT, dx: Math.cos(dir) * len, dy: Math.sin(dir) * len,
          sx: Math.cos(startAngle) * startRadius, sy: Math.sin(startAngle) * startRadius,
          swirl: rand(1.1, 2.4) * (Math.random() < 0.5 ? -1 : 1),
          t0, t1: t0 + dur, dur,
          bucket: Math.floor(Math.random() * COLORS) * WIDTHS.length + Math.floor(Math.random() * WIDTHS.length),
          ox: 0, oy: 0, bx: 0, by: 0, bt: -1, x: 0, y: 0
        });
      }
      formedAt = Math.max(...particles.map(p => p.t1));
      glints = [];
      time = reduceMotion ? formedAt + 10 : 0;
    }

    function buildDust() {
      dust = Array.from({ length: DUST }, () => ({
        x: Math.random(), y: Math.random(), r: rand(0.4, 1.6),
        speed: rand(0.004, 0.018), phase: rand(0, Math.PI * 2), twinkle: rand(0.6, 1.8),
        pink: Math.random() < 0.7
      }));
    }

    function resize() {
      width = Math.max(1, innerWidth); height = Math.max(1, innerHeight);
      dpr = Math.min(2, Math.max(1, devicePixelRatio || 1));
      canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
      unit = Math.min(width, height) / 640;
      cx = width / 2; cy = height / 2;
      layer = document.createElement('canvas');
      layer.width = canvas.width; layer.height = canvas.height;
      layerCtx = layer.getContext('2d');
      layerCtx.lineCap = 'round';
      // A small copy, scaled back up, gives a cheap soft bloom that works in every browser.
      glow = document.createElement('canvas');
      glow.width = Math.max(1, Math.round(width / 6)); glow.height = Math.max(1, Math.round(height / 6));
      glowCtx = glow.getContext('2d');
      background = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(width, height) / 2);
      background.addColorStop(0, '#16040f');
      background.addColorStop(0.55, '#070106');
      background.addColorStop(1, '#000');
      if (reduceMotion) render();
    }

    // Two-bump "lub-dub" heartbeat.
    function pulse(t) {
      const ph = t % BEAT_PERIOD;
      return Math.exp(-((ph / 0.075) ** 2)) + 0.62 * Math.exp(-(((ph - 0.27) / 0.085) ** 2));
    }

    function toHeartUnits(clientX, clientY) {
      const scale = unit * currentBeatScale();
      return { x: (clientX - cx) / scale, y: -(clientY - cy) / scale };
    }

    function beatAmount() {
      return Math.max(0, Math.min(1, (time - formedAt + 0.6) / 1.8));
    }
    function currentBeatScale() {
      return 1 + 0.05 * pulse(time) * beatAmount();
    }

    function burst(point) {
      for (const p of particles) {
        if (time < p.t1) continue;
        const vx = p.hx - point.x, vy = p.hy - point.y;
        const dist = Math.hypot(vx, vy) || 1;
        const strength = (150 * Math.exp(-dist / 240) + 35) * rand(0.6, 1.3);
        const spread = rand(-0.45, 0.45);
        const ux = vx / dist, uy = vy / dist;
        p.bx = (ux * Math.cos(spread) - uy * Math.sin(spread)) * strength;
        p.by = (ux * Math.sin(spread) + uy * Math.cos(spread)) * strength;
        p.bt = time;
      }
    }

    function update(dt) {
      time += dt;
      const flying = !reduceMotion && time < formedAt + 0.5;
      const repelRadius = 95;
      for (const p of particles) {
        let x = p.hx, y = p.hy;
        if (time < p.t1) {
          const k = Math.max(0, (time - p.t0) / p.dur);
          const e = easeOutCubic(Math.min(1, k));
          const rest = 1 - e, angle = p.swirl * rest;
          const ox = (p.sx - p.hx) * rest, oy = (p.sy - p.hy) * rest;
          x += ox * Math.cos(angle) - oy * Math.sin(angle);
          y += ox * Math.sin(angle) + oy * Math.cos(angle);
        }
        if (p.bt >= 0) {
          const tau = time - p.bt;
          if (tau > 4.5) p.bt = -1;
          else {
            const f = 1.7 * (1 - Math.exp(-9 * tau)) * Math.exp(-1.6 * tau);
            x += p.bx * f; y += p.by * f;
          }
        }
        // Particles drift aside from the finger or mouse, then ease back home.
        let tx = 0, ty = 0;
        if (pointer.active && !flying) {
          const ddx = x - pointer.x, ddy = y - pointer.y;
          const d2 = ddx * ddx + ddy * ddy;
          if (d2 < repelRadius * repelRadius) {
            const d = Math.sqrt(d2) || 1, push = (1 - d / repelRadius) ** 2 * 38;
            tx = ddx / d * push; ty = ddy / d * push;
          }
        }
        p.ox += (tx - p.ox) * 0.14; p.oy += (ty - p.oy) * 0.14;
        p.x = x + p.ox; p.y = y + p.oy;
      }
      // A few random strokes flare up white, like the original's spark trail.
      if (time > 1 && !reduceMotion) {
        for (let n = 0; n < 3; n++) {
          const p = particles[(Math.random() * particles.length) | 0];
          if (time >= p.t1) glints.push({ p, born: time });
        }
      }
      glints = glints.filter(g => time - g.born < 0.55);
    }

    function render() {
      const beat = pulse(time) * beatAmount();
      const scale = unit * (1 + 0.05 * beat);

      // Background, rising dust and the heart's halo.
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, width, height);
      for (const d of dust) {
        const y = ((d.y - time * d.speed) % 1 + 1) % 1;
        const a = 0.18 + 0.22 * (0.5 + 0.5 * Math.sin(time * d.twinkle + d.phase));
        ctx.globalAlpha = a;
        ctx.fillStyle = d.pink ? '#ff8fd0' : '#ffe6f4';
        ctx.beginPath();
        ctx.arc(d.x * width, y * height, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
      const formed = Math.min(1, time / formedAt);
      const haloRadius = 330 * scale;
      const halo = ctx.createRadialGradient(cx, cy - 8 * scale, 0, cx, cy - 8 * scale, haloRadius);
      halo.addColorStop(0, `rgba(255,70,170,${0.10 * formed + 0.13 * beat})`);
      halo.addColorStop(0.6, `rgba(190,20,120,${0.04 * formed + 0.05 * beat})`);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, width, height);

      // Particles: one batched path per colour/width bucket keeps 4500 strokes fast on phones.
      layerCtx.setTransform(1, 0, 0, 1, 0, 0);
      layerCtx.clearRect(0, 0, layer.width, layer.height);
      layerCtx.setTransform(dpr * scale, 0, 0, -dpr * scale, cx * dpr, cy * dpr);
      const paths = Array.from({ length: COLORS * WIDTHS.length }, () => new Path2D());
      const hot = new Path2D();
      for (const p of particles) {
        if (time < p.t0) continue;
        const path = time < p.t1 + 0.3 ? hot : paths[p.bucket];
        path.moveTo(p.x, p.y);
        path.lineTo(p.x + p.dx, p.y + p.dy);
        if (path === hot) {
          // Landing flash: draw the stroke in its own colour too, so it stays once the flash fades.
          paths[p.bucket].moveTo(p.x, p.y);
          paths[p.bucket].lineTo(p.x + p.dx, p.y + p.dy);
        }
      }
      layerCtx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < paths.length; i++) {
        layerCtx.strokeStyle = palette[(i / WIDTHS.length) | 0];
        layerCtx.lineWidth = WIDTHS[i % WIDTHS.length];
        layerCtx.globalAlpha = 0.62 + 0.18 * beat;
        layerCtx.stroke(paths[i]);
      }
      const glintPath = new Path2D();
      for (const g of glints) {
        glintPath.moveTo(g.p.x, g.p.y);
        glintPath.lineTo(g.p.x + g.p.dx, g.p.y + g.p.dy);
      }
      layerCtx.lineWidth = 1.5;
      layerCtx.strokeStyle = '#ffc9e8';
      layerCtx.globalAlpha = 0.7;
      layerCtx.stroke(hot);
      layerCtx.strokeStyle = '#fff0fa';
      layerCtx.globalAlpha = 0.85;
      layerCtx.stroke(glintPath);

      // Composite the particles, then add the bloom on top.
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.drawImage(layer, 0, 0);
      glowCtx.clearRect(0, 0, glow.width, glow.height);
      glowCtx.drawImage(layer, 0, 0, glow.width, glow.height);
      ctx.globalAlpha = 0.55 + 0.35 * beat;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(glow, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      if (!reduceMotion && !hintShown && !interacted && time > formedAt + 1.2) {
        hintShown = true;
        hint.classList.add('show');
      }
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    function restart() {
      build();
    }

    canvas.addEventListener('pointerdown', event => {
      if (reduceMotion) return;
      interacted = true;
      hint.classList.remove('show');
      const now = performance.now();
      if (now - lastTap < 320) { lastTap = -1; restart(); return; }
      lastTap = now;
      const point = toHeartUnits(event.clientX, event.clientY);
      pointer.x = point.x; pointer.y = point.y;
      pointer.active = event.pointerType !== 'mouse';
      burst(point);
    });
    canvas.addEventListener('pointermove', event => {
      if (reduceMotion) return;
      if (event.pointerType === 'mouse' || event.buttons) {
        const point = toHeartUnits(event.clientX, event.clientY);
        pointer.x = point.x; pointer.y = point.y; pointer.active = true;
      }
    });
    const release = event => { if (event.pointerType !== 'mouse' || event.type === 'pointerleave') pointer.active = false; };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('pointerleave', release);
    addEventListener('resize', resize);

    build();
    buildDust();
    resize();
    if (reduceMotion) {
      update(0);
      render();
    } else {
      requestAnimationFrame(now => { last = now; requestAnimationFrame(frame); });
    }
  })();
  </script>
</body>
</html>
